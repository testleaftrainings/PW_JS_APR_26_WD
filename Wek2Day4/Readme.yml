Partial attribute values in CSS selector:
--------------------------

input[name*="USER"] --> contains

[id^="name"] --> starts with

^-> caret

[id$="name"] --> end with 

Child Selector (>)
Syntax:
parent > child
Meaning:

Select only direct child

Adjacent Sibling Selector (+)
Syntax:
element1 + element2
Meaning:

Select immediate next sibling

Example:
<label>Username</label>
<input type="text">
<input type="password">
label + input

👉 Selects first input only (immediately after label)

Simple sentence:

“Find input which comes immediately after label”

Combining with attributes (real-time usage)
<div class="form">
  <label>Email</label>
  <input type="text" name="email">
</div>
.form > input[name="email"]


CSS Locators with multiple matching elements:
--------------------------------------------

nth () method :
--------------
The nth() method in Playwright is used to select a specific element from multiple matched 
elements using its index. The index starts from 0.

syntax:
-------

locator.nth(index) -> index starts from 0 (zero-based index)


.first() -> 1st match in the DOM
.last() -> last match in the DOM
.nth() -> 2nd or 3rd match 
nth(0) == first()
index start from 0,1,2,3

ex: 
await page.locator().first().click() //first match, using either first() or nth(0)
await page.locator().last().click() //last match last()
await page.locator().nth(1).click() //second match nth(1)



