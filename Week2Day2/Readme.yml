What is a callback function?

A callback is just a function you give to another function, and you are telling it:

👉 “When you finish your work, call this function back.”

That’s it!

Simple Example (Real Life)

Ordering Pizza

You call a pizza shop and tell them:

“Here is my number.
When the pizza is ready, call me back.”

You don’t wait on the phone.
You go do your own work.

Later, the pizza shop finishes making your pizza → they call you back.

That phone call = callback.

💻 Same Logic in JavaScript

function makePizza(callback) {

    console.log("Making pizza...");

    setTimeout(() => {
        console.log("Pizza ready!");
        callback(); // calling back
    }, 2000);

}

makePizza(() => {
    console.log("Eat the pizza!");
});

What’s happening?

You give a function → () => { console.log("Eat the pizza!"); }

makePizza() does its work.

When it's finished, it calls your function back.

*** Why do we use callbacks?

Because some tasks take time:

✔ Reading files
✔ Calling APIs
✔ Waiting for user input
✔ Waiting for timers

Instead of blocking everything, JS says:

“Give me a function, I’ll call you back when I’m done.”

***Simple one-line definition

A callback is a function passed to another function so it can run later.

