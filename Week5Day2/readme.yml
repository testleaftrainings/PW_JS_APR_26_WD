Installation commands:
----------------------
command to install csv-parse:
npm install csv-parse

command to install fs:
npm install fs

command to install path:
npm install path

syntax to read file synchronously and parse it to Json format
---------------------------------------------------

let value:any[]=parse(fs.readFileSync(path.join(__dirname,"folder path")),{columns:true, skip_empty_lines:true}})

/* path.join(__dirname, ...) → absolute path 
fs.readFileSync() → reads file 
parse/sync → converts to array 
Now for...of works  

1. let value:any[]

value → variable name
any[] → array of any type (TypeScript)
Means: value will store array of objects

2. parse(...)

Function from csv-parse
Converts CSV → JavaScript data

3. fs.readFileSync(...)

Reads CSV file
Returns file content (buffer/string)

4. path.join(__dirname,"../../../data/lf.csv")

Builds absolute path
__dirname → current file location
../../../ → go up 3 folders
Points to data/lf.csv

5. { columns: true }

Converts CSV rows into object format
Uses header as keys

Without columns:true
[
 ['1','admin','pass']
]
With columns:true
[
 {
   tcid:'1',
   username:'admin',
   password:'pass'
 }
]

Much easier to use.

6.skip_empty_lines:true

Ignores blank rows in CSV.
Prevents parsing issues.

CSV file is read synchronously using fs, parsed into JavaScript objects using csv-parse, and the file path
is constructed using path.join with __dirname to form an absolute path.

CSV file → readFileSync → parse → array of objects → stored in value*/

 1. path.join()
Comes from Node.js built-in path module.
It is used to safely combine multiple parts of a file path.
It automatically adds / or \ depending on your operating system (Windows, macOS, Linux).

Example:

path.join("folder", "subfolder", "file.txt")
Result (on Windows):
folder\subfolder\file.txt
Result (on Mac/Linux):
folder/subfolder/file.txt

So, path.join() helps build paths without worrying about slashes.

🔹 2. __dirname
It's a special variable in Node.js.
It gives the absolute path of the current JavaScript file's directory.

Example: If your file is located in:
C:\Projects\Playwright\Tests\DownloadTest.js

Then:
console.log(__dirname)
will print:

C:\Projects\Playwright\Tests\Week4Day4


🔹 3. ../../Data
This part means:

Go two folders up from the current directory (../ twice).
Then go inside the “Data” folder.
So if your current file is:

C:\Projects\Playwright\Tests\DownloadTest.js

Then ../../Data points to:
C:\Projects\Data

