 Typescript Basics:
 ------------------

 Typescript is a superset of JavaScript that adds static typing and other features to enhance code quality and 
 maintainability. 
 It compiles down to plain JavaScript, making it compatible with any environment that runs JavaScript.


| Feature              | JavaScript (JS)                                       | TypeScript (TS)                                          |
| -------------------- | ----------------------------------------------------- | -------------------------------------------------------- |
| **Definition**       | A scripting language used to create dynamic web pages | A superset of JavaScript developed by Microsoft          |
| **Typing**           | Dynamically typed                                     | Statically typed (supports type checking)                |
| **Error Detection**  | Errors appear mostly at runtime                       | Errors can be detected during compile time
| **Compilation**      | Runs directly in browser                              | Must be compiled to JavaScript before running            |
| **Code Maintenance** | Harder in large projects                              | Easier for large-scale applications                      |           |
| **Syntax**           | Simpler                                               | Slightly more structured due to types                    |


 Installation commands
 ---------------------

// Install TypeScript globally using npm
npm install -g typescript 

//to check the version of typescript installed
tsc -v 

//to install typescript locally in a project
npm install --save-dev typescript

//to initialize a TypeScript project and create a tsconfig.json file
tsc --init

//to compile TypeScript files to JavaScript and execute the compiled JavaScript file
tsc filename.ts   ->compiles filename.ts to filename.js
node filename.js   -> executes the compiled JavaScript file

//to run your TypeScript file directly without compiling it to JavaScript using ts-node
npm install -g ts-node

command:
ts-node filename.ts


Type Inference: TypeScript automatically assigns the datatype based on the value given to the variable. 
---------------

Implicit inference:
------------------

Implicit type inference means TypeScript automatically understands the data type of a variable based on the value 
assigned to it.

Ex:
let city = "Chennai";   // inferred as string
let count = 100;        // inferred as number
let isActive = true;    // inferred as boolean

Explicit inference:
-------------------
explicit type inference is when you explicitly declare the data type of a variable in TypeScript.

 EX: let name: string = "Gauthami";
     let Id: number = 2567;

Why We Compile TypeScript?
Explanation

TypeScript cannot run directly in browser or Node.js.

Reason:

Browsers understand only JavaScript
Node.js also executes JavaScript

So TypeScript must be converted → JavaScript using compiler (tsc)

Simple Flow
TypeScript (.ts) → Compile → JavaScript (.js) → Run
Simple Sentence

TypeScript must be converted to JavaScript before execution.

Datatypes in TypeScript 
-----------------------

1. number
2. string
3. boolean
4. undefined
5. null
6. any 
7. unknown
8. never
9. tuple

number: It is used to represent both integer and floating-point numbers.

string: It is used to represent text data. It can be enclosed in single quotes, double quotes, or backticks.

boolean: It is used to represent logical values, which can be either true or false.

undefined: It is a type that represents the absence of a value. A variable that has been declared but not assigned a 
value is of type undefined.

null: It is a type that represents the intentional absence of any object value. It is often used to indicate that a 
variable has no value assigned to it.

any: It is a type that can represent any value. used when are not sure about the datatype.

ex: analyze the data from an API and we are not sure about the datatype of the response.
let data: any = fetchDataFromAPI();
expected output: data can be of any type, such as string, number, object, etc.

unknown: It is a type that can represent any value, but it is safer than any because it requires type checking before
using the value.
ex: let square:unknown=5
if(typeof square === number){
    console.log(square*square);
}
expected output: 25

never: It is a type that represents values that never occur. It is used for functions that throw exceptions or have
infinite loops.

Ex:
function stopTest(message: string): never {
  throw new Error(message);
}

stopTest("Login failed");


| Type    | Meaning                                        |
| ------- | ---------------------------------------------- |
| `void`  | Function runs and finishes but returns nothing |
| `never` | Function never finishes                        |


tuple: It is a type that represents an array with a fixed number of elements, where each element can have a different type.
ex: let person: [string, number] = ["Arun", 30];
console.log(person[0]);//Arun
