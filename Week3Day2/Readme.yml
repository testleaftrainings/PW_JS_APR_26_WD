How getByLabel works internally

Playwright doesn’t just match visible text randomly. It follows accessibility rules:

It looks for a <label> element with text "Password"
Then it checks the for="password" attribute
It finds the input with id="password"
It links both → this becomes a label-control relationship

So Playwright understands:
👉 “Password” label is connected to that input field
 