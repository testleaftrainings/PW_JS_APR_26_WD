Request fixture and Axios:
--------------------------

1) We use Playwright request fixture for UI tied API's
2) We use axios http library for independent API like Jira

Playwright->Request fixture can not interact with third party libraries, so need to install axios
axios: common api for all api calls

installation command:
npm install axios



