Steps to create Jira Account
----------------------------

1) goto website https://www.atlassian.com/software/jira
2) click on 'Get it free' under Jira s/w
3) you will be directed to Atlassian's sign-up page
4) click on 'Sign up'
5) Check your email inbox for a verification link from Atlassian and click on it
6) Set a strong password for your Atlassian account.
7) Once logged in, you will land on the JIRA dashboard where you can start creating projects.

Steps to create project
-----------------------
scrum->use template->'team-managed project'->Create Project ex: PW_Jira25 and click next->'Bring your team along'-click on
 'skip'->project is successfully created
and listed uder 'projects' tab.


steps to generate API Token
---------------------------

click on profile-> Account Settings->click on security tab-> scroll in this page and click on Create and manage API tokens
->verify your mail id by enetering OTP->click on create API token-> provide the Name "Jira-API -Token" and expiry for the
 token ex:"12/27/25"-> now click on create->Copy your API token for future reference->
click on done.


