Interacting with Multiple Windows


Window Handling: Managing and interacting with multiple browser tabs or windows using Page objects, 
enabling the automation script to switch and perform actions in the correct window.

Window Handling using Event Listener + Promise
----------------------------------------------

Create Promise - Wait for new window(event listener)
Trigger Action - Perform Click action
Resolve Promise - Switch control parent → child window 


1) Sequential Approach

Handle windows one by one, waiting for each window/tab to open and complete actions before moving to the next.
Simple, predictable, easy to debug.

const newPage = context.waitForEvent('page') // Pending // Step 1 : Listener open
await page.locator(`//div[contains(text(),"MOTOROLA g35 5G")]`).click(); // Click Event // Step 2 : Click action
const childPage =   await newPage // Step3 : Resolving the promise //The Promise is resolved ones playwright has captured 
the newPage launched.

2) Concurrent Approach

Handle multiple windows/tabs at the same time, without waiting for one to finish before starting another.
Uses Promise.all() to run multiple operations concurrently.

const [childPage] = await Promise.all([context.waitForEvent('page'),page.locator(`//div[text()="POCO C71 (Desert Gold, 
64 GB)"]`).click()])


Note: Concurrent Approach is Preferred in Playwright because it ensures no events are missed, even when actions run fast.
-----

context.pages();
---------------
Returns all open pages in the context

page.bringToFront()
--------------------
Brings a tab to the foreground and makes it the active page, but does not close it — used when multiple tabs are open 
and you want to interact with a specific one.

swtich -> child window

page.close()
------------

Closes the current tab/page completely and removes it from the browser context — used when the tab is no longer needed.


