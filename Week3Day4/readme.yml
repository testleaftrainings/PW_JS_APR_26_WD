Type assertion:
---------------

Type Assertion in TypeScript is a way to tell the compiler to treat a value as a specific type when the developer knows 
the type better than the compiler

2 ways to perform type assertion:

1) using angular brackets syntax

let response : any = "Record from server"
let myResponse = <string> response
console.log(myResponse.length);


2) using as keyword

let sCode : any = "Sucess"
let statusLength = sCode as string
console.log(statusLength.length);

object literal in Typescript:
-----------------------------

In TypeScript, an object literal is a way to define an object with specific properties and their types. It allows you to
create objects with a defined structure, making it easier to work with complex data.

ex: let user = {
    username: "admin",
    password: "admin123"
};

This is called an object literal. We are creating an object directly with values.

await page.fill("#user", loginData.username);
await page.fill("#pass", loginData.password);

type alias:
-----------

A type alias in TypeScript is a way to create a new name for an existing type. It allows you to define a custom type
that can be used throughout your codebase, making it easier to manage and maintain complex types.

type user ={
firstname : string
lastname : string
mobnumber : number
}
let user1 :user ={firstname : 'yuvarani', lastname: 's', mobnumber:987656778}
types:
------

1. Union types
2. Intersection types

Union Types
-----------

type Id = string | number | boolean | ;

let userId: Id;

userId = "EMP101";   // valid
userId = 1001;       // valid

