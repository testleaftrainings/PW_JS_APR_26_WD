storageState:
-------------

Storage state is a feature in Playwright that allows you to save the state of the browser,including cookies, local storage,
and session storage, to a file. This can be useful for maintaining a logged-in state across multiple test runs without 
having to go through the login process each time.

syntax:
-------

// Step 1: Login and save state in json format
await page.context().storageState({ path: 'state.json' })

//Step 2: Reuse state in another test
test.use({ storageState: 'state.json' })


